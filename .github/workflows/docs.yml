name: Documentation

# Versioning matches the CTLD model: develop -> "dev" (site default until a stable release
# exists), a tag -> its own version, plus the "latest" alias if it is a plain vX.Y.Z (a
# pre-release tag publishes its own version only, so a release candidate never becomes what
# a newcomer reads by default).
#
# `master` publishes nothing of its own. It used to deploy "latest" here, which made
# "latest" a *version* rather than an alias -- and the v3.5.0 tag then failed with
# "alias 'latest' already specified as a version", because a name cannot be both. Nothing
# was lost by dropping it: a tag is always on master, so the two steps published the same
# content, and the master step only ever had a reason to exist while no release did.
# The consequence is deliberate: between two releases, master is not published anywhere.
on:
  push:
    branches: [develop]
    tags:
      - "v*"

  # Republish a version's pages without moving its tag. Re-running the tag build would rebuild
  # from the *tagged* commit, so a documentation fix landed after the tag could never reach the
  # published pages -- this path builds from the branch it is run on and deploys under the version
  # you name. It is what let 3.5.0's pages become bilingual without spending a version number on a
  # translation (CHORE-DOCS-MANUAL-REPUBLISH); it does not republish the artifact, which stays
  # whatever the tag built.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to republish, e.g. 3.5.0. Leave empty to redeploy the 'dev' alias."
        required: false
        type: string
      # Default false, and that is not timidity. Republishing a version that already carries
      # `latest` refreshes `/latest/` either way -- mike rebuilds every alias directory the
      # version owns, not just the ones named on the command line. So checking this box changes
      # nothing in the normal case, and in the other one -- republishing 3.5.0 while 3.7.0 is out
      # -- it drags `latest` and the site default back to old documentation, greenly.
      set_latest:
        description: "Move the 'latest' alias and the site default to that version. Only for the newest release."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# mike pushes to gh-pages with a plain push, so two runs at once mean the second fetched before the
# first landed and its push is rejected. The window is real now that a manual republish can start
# while a `develop` push is deploying. Queuing costs a minute; cancelling would drop a deployment
# on the floor, which is the outcome to avoid.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs Material and mike
        run: pip install -r build-tools/docs-requirements.txt

      - name: Configure git for mike's commits to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # `github.event_name == 'push'` matters: a manual run started from `develop` carries that
      # same ref, so without it a republish of 3.5.0 would redeploy the `dev` alias as a side
      # effect of asking for something else.
      - name: Deploy dev (develop branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          mike deploy --push --update-aliases dev
          # Bootstrap only: keep "dev" the default until a stable release exists. Once
          # "latest" exists, the tag step below owns the default from then on.
          if ! mike list | grep -qw latest; then
            mike set-default --push dev
          fi

      # Same `push` guard as the step above, and for the same reason: `workflow_dispatch` accepts
      # a tag as its ref, and the run-workflow menu offers them. Without it, republishing 3.5.0
      # from the v3.6.0 tag would redeploy 3.6.0 and move `latest` before the republish even ran.
      - name: Deploy a tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            mike deploy --push --update-aliases "$version" latest
            mike set-default --push latest
          else
            mike deploy --push "$version"
          fi

      # The version arrives through the environment rather than being interpolated into the
      # script: a workflow input is untrusted text, and `${{ }}` inside `run` pastes it into the
      # shell before bash ever sees a quote.
      - name: Republish a version (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          SET_LATEST: ${{ inputs.set_latest }}
        run: |
          VERSION="${VERSION#v}"   # the tag is what one has in hand; the version is what mike knows
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version number (expected 3.5.0, or 3.6.0-rc1)"
            exit 1
          fi
          # Exact match on the version field, not a grep over the printed list. `grep -w` treats
          # `-` as a word boundary, so it answers yes for 3.6.0 when only 3.6.0-rc1 is published
          # and mike would then *create* a 3.6.0 that no release ever produced — the very thing
          # the message below promises cannot happen. `mike list` is not greppable either: it
          # prints `"Title" (version)` when a version carries a title.
          if ! mike list --json | python -c \
              "import json,os,sys; sys.exit(0 if any(v['version']==os.environ['VERSION'] for v in json.load(sys.stdin)) else 1)"; then
            echo "::error::no published version '$VERSION' — this republishes pages, it does not create a release"
            exit 1
          fi
          if [ "$SET_LATEST" = "true" ]; then
            mike deploy --push --update-aliases "$VERSION" latest
            mike set-default --push latest
          else
            mike deploy --push "$VERSION"
          fi

      - name: Redeploy the dev alias (manual, no version given)
        if: github.event_name == 'workflow_dispatch' && inputs.version == ''
        run: mike deploy --push --update-aliases dev
