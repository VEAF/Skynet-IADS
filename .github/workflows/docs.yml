name: Documentation

# Versioning matches the CTLD model: develop -> "dev" (site default until a stable release
# exists), a tag -> its own version, plus the "latest" alias if it is a plain vX.Y.Z (a
# pre-release tag publishes its own version only, so a release candidate never becomes what
# a newcomer reads by default).
#
# `master` publishes nothing of its own. It used to deploy "latest" here, which made
# "latest" a *version* rather than an alias -- and the v3.5.0 tag then failed with
# "alias 'latest' already specified as a version", because a name cannot be both. Nothing
# was lost by dropping it: a tag is always on master, so the two steps published the same
# content, and the master step only ever had a reason to exist while no release did.
# The consequence is deliberate: between two releases, master is not published anywhere.
on:
  push:
    branches: [develop]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  deploy:
    name: Build and deploy the documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs Material and mike
        run: pip install -r build-tools/docs-requirements.txt

      - name: Configure git for mike's commits to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy dev (develop branch)
        if: github.ref == 'refs/heads/develop'
        run: |
          mike deploy --push --update-aliases dev
          # Bootstrap only: keep "dev" the default until a stable release exists. Once
          # "latest" exists, the tag step below owns the default from then on.
          if ! mike list | grep -qw latest; then
            mike set-default --push dev
          fi

      - name: Deploy a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            mike deploy --push --update-aliases "$version" latest
            mike set-default --push latest
          else
            mike deploy --push "$version"
          fi
