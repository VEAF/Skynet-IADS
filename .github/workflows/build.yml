name: Build

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build the compiled artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: python3 build-tools/build-compiled-script.py

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -q
          sudo apt-get install -y lua5.1

      - name: Load and run the compiled script against the DCS stub
        run: lua5.1 test/common/run.lua test_compiled_script
