name: Lua tests

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  lua-unit-tests:
    name: Lua unit tests (5.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -q
          sudo apt-get install -y lua5.1

      - name: Run the standalone suite
        run: lua5.1 test/lua/run.lua

  # unit-tests/skynet-unit-tests.miz is the legacy in-sim suite. CI cannot run it -- it needs the
  # simulator -- but it can check that the archive is not broken, which until now nothing did. A
  # script is wired into a .miz in four places (see build-tools/miz-suite.py); a hand edit that
  # misses one leaves a mission that loads a resource key naming nothing, and the only way to find
  # out was to open DCS.
  in-sim-mission:
    name: In-sim mission archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -q
          sudo apt-get install -y lua5.1

      - name: Check the mission's script wiring
        run: python3 build-tools/miz-suite.py check

      # Syntax only: these scripts call into DCS and MOOSE, so they cannot be executed here. What
      # this catches is a truncated or corrupted file inside the archive.
      - name: Parse every Lua file in the archive
        run: |
          set -o pipefail
          python3 build-tools/miz-suite.py extract "$RUNNER_TEMP/miz"
          status=0
          for f in "$RUNNER_TEMP"/miz/*.lua; do
            if lua5.1 -e "assert(loadfile('$f'))" 2>"$RUNNER_TEMP/err"; then
              echo "ok    $(basename "$f")"
            else
              echo "FAIL  $(basename "$f"): $(cat "$RUNNER_TEMP/err")"
              status=1
            fi
          done
          exit $status

  test-coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # luacov is pure Lua, but it has to land where lua5.1 will find it: apt's luarocks is
      # built against the distribution's default Lua, and --lua-version redirects it. The
      # 5.1 headers are what lets it configure that version, the same way lint.yml needs them.
      - name: Install Lua 5.1 and luacov
        run: |
          sudo apt-get update -q
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install luacov
          # require, not -lluacov: the latter would start a collection here and drop a stats
          # file into the checkout before the measurement run has begun.
          lua5.1 -e "require('luacov.runner') print('luacov resolves under ' .. _VERSION)"

      # A separate job on purpose: the suite above must keep running with no debug hook
      # installed. It takes under a second, so running it twice costs nothing.
      - name: Run the suite under luacov
        env:
          SKYNET_TEST_COVERAGE: 1
        run: lua5.1 test/lua/run.lua

      # pipefail matters: without it the pipeline reports tee's status, so a reporter that exits
      # non-zero — below the floor (1), or no measurement at all (2) — would leave the step green.
      # The status is held back until the summary is written, because a failing run is exactly the
      # one whose per-file table the reviewer needs. The scratch file goes to the runner's temp,
      # not into the checkout.
      - name: Report test coverage
        run: |
          set -o pipefail
          status=0
          lua5.1 build-tools/report-test-coverage.lua 2>&1 | tee "$RUNNER_TEMP/test-coverage.txt" || status=$?
          {
            echo '### Test coverage'
            echo ''
            echo '```'
            cat "$RUNNER_TEMP/test-coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload the per-line report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: luacov.report.out
          if-no-files-found: warn
