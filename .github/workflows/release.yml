name: Release

# A vX.Y.Z tag on master publishes a GitHub release. build-tools/release.py checks the tag, builds
# the script and fills build/release/ with what is attached; it refuses any other tag. The same
# script, run on the release branch, showed beforehand what this run publishes. CONTRIBUTING.md has
# the procedure.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/lua-tests.yml

  release:
    name: Package and publish the release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history, so the tagged commit can be checked against origin/master.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the tag is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::tag $GITHUB_REF_NAME is not on master"
            exit 1
          fi

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -q
          sudo apt-get install -y lua5.1

      - name: Package
        # -u: unbuffered, so its lines land in the log before the Lua test's, not after.
        run: python3 -u build-tools/release.py --tag "$GITHUB_REF_NAME"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/release/skynet-iads-compiled.lua \
            build/release/skynet-test-persian-gulf.miz \
            build/release/skynet-and-moose-a2a-dispatcher.miz \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file build/release/notes.md
