name: Lint

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

# build-tools/lint.sh fetches the pinned tools itself, so CI runs exactly what a contributor runs.
jobs:
  luacheck:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run luacheck
        run: bash build-tools/lint.sh luacheck

  stylua:
    name: stylua --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check formatting
        run: bash build-tools/lint.sh stylua
